name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check project state
        run: python scripts/check_project_state.py
      - name: Check stable product baseline
        run: python scripts/check_stable_baseline.py
      - name: Verify pinned release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json
          b=json.load(open("STABLE_BASELINE.json", encoding="utf-8"))
          s=json.load(open("PROJECT_STATE.json", encoding="utf-8"))
          r=b["runtime_release"]
          print(f"TAG={r['tag']}")
          print(f"TAG_SHA={r['tag_sha']}")
          print(f"RELEASE_ID={r['release_id']}")
          print(f"EXE_SIZE={r['exe']['size']}")
          print(f"EXE_SHA256={r['exe']['sha256']}")
          print(f"CHECKSUM_SIZE={r['checksum']['size']}")
          print(f"CHECKSUM_SHA256={r['checksum']['sha256']}")
          frozen = s.get("status") in {"post-release", "released"} and s.get("active_engineering_issue") is None
          print(f"REQUIRE_LATEST={'1' if frozen else '0'}")
          PY
          )"
          actual_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          test "$actual_tag_sha" = "$TAG_SHA"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.assets[] | select(.name=="FirstWindow-Windows-x64.exe") | .size' <<<"$release_json")" = "$EXE_SIZE"
          test "$(jq -r '.assets[] | select(.name=="FirstWindow-Windows-x64.exe") | .digest' <<<"$release_json")" = "sha256:$EXE_SHA256"
          test "$(jq -r '.assets[] | select(.name=="SHA256SUMS.txt") | .size' <<<"$release_json")" = "$CHECKSUM_SIZE"
          test "$(jq -r '.assets[] | select(.name=="SHA256SUMS.txt") | .digest' <<<"$release_json")" = "sha256:$CHECKSUM_SHA256"
          if [ "$REQUIRE_LATEST" = "1" ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" = "$TAG"
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.id')" = "$RELEASE_ID"
          fi
          echo "pinned release identity verified: $TAG release_id=$RELEASE_ID require_latest=$REQUIRE_LATEST"
      - name: Validate repository
        run: python scripts/validate.py
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
